公共物理前提:
  材料: '只用已封configs/materials.yaml内已知常物性SiC/Cu密度、比热、导热率；所有方法一致'
  几何与坐标: '顶面深度z=0至SiC/Cu界面z=0.012m，再至固定底z=0.0175m；输入仅[z,t,q,材料]四列，无圆柱r'
  初值与底边界K: 295.15
  顶部面热流: '训练折已吸收均匀合成q(W/m²)，正入板；-k_SiC*dT/dz=q，非原激光整束功率'
  HF已知接触热阻_m2_K_W: 0.0001
  界面共同约束: '-k_SiC*dT_SiC/dz=-k_Cu*dT_Cu/dz；T_SiC-T_Cu=Rc*(-k_SiC*dT_SiC/dz)'
  F1_F3内部方程: '每材料分别rho*c*dT/dt-k*d²T/dz²=0，固定每材料八配点；不能用HF全场作训练或校正'
  F2内部方程: '不调用一维体内二阶PDE计算；仍有同一已知初值、上下边界及界面两个残差'
同LF成对PDE对照: true
F2体内PDE计算: false
F1或F3体内PDE计算: true
