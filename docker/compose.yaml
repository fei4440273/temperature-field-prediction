services:
  sic-cu-pinn:
    image: ra-msml-pinn:local-cu124
    working_dir: /workspace
    ipc: host
    stdin_open: true
    tty: true
    environment:
      PYTHONPATH: /workspace/src
      CUDA_VISIBLE_DEVICES: 0,1
      MPLBACKEND: Agg
    volumes:
      - ..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
