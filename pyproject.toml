[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sic-cu-temperature"
version = "0.1.0"
description = "Multi-fidelity transient temperature-field prediction for a SiC-Cu assembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=2.0",
  "polars>=1.20",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "torch>=2.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sic-cu-predict = "sic_cu.prediction_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
